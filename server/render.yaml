services:
  - type: web
    name: campushire-backend
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: node src/scripts/seed.js && node server.js
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: DB_PATH
        value: ./data/campushire.sqlite
